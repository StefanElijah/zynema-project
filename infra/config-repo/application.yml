# ══════════════════════════════════════════════════════════════════════
# Shared defaults for ALL Zynema services (served by config-server).
#
# RULES for this file:
#  1. NEVER put `spring.application.name` here: it is per-service and must
#     come from each service's own application.yml.
#  2. NEVER put `spring.config.import: configserver:...` here: the config
#     server would try to import from itself while serving a request and
#     deadlock. The import lives in each service's local application.yml.
#  3. Only put properties that are truly identical across services.
# ══════════════════════════════════════════════════════════════════════

spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
