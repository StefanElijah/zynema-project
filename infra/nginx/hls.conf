server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Signed HLS delivery (ADR-0024).
    #
    # playback-service presigns every object for the internal endpoint
    # (http://minio:9000) and hands the client THIS address with the signature
    # in the query string. SigV4 signs the Host header, so the proxy must
    # present the host the signature was computed for — otherwise MinIO
    # rejects a perfectly valid URL.
    #
    # The buckets stay private: there is no anonymous-read policy anywhere, and
    # an expired or tampered signature gets a 403 straight from MinIO.
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # The player runs on another origin (the SPA dev server or the gateway).
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Authorization' always;
            return 204;
        }
    }
}
