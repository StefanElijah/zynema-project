# Alert rules for the local stack.
#
# Three questions, in the order they matter:
#   1. Is anything unreachable? (availability)
#   2. Is it answering errors? (correctness)
#   3. Is it slow? (latency)
#
# `service` is copied from the scrape job so Alertmanager can group by it and
# the notification says which application is in trouble.

groups:
  - name: zynema-availability
    rules:
      - alert: ZynemaServiceDown
        expr: up{job!="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          service: '{{ $labels.job }}'
        annotations:
          summary: '{{ $labels.job }} is not being scraped'
          description: >
            Prometheus has failed to scrape {{ $labels.job }} ({{ $labels.instance }})
            for more than 2 minutes. The process is down, or its metrics endpoint
            is not answering.

  - name: zynema-errors
    rules:
      - alert: ZynemaHighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: '{{ $labels.job }}'
        annotations:
          summary: '{{ $labels.job }} is answering more than 5% 5xx'
          description: >
            Over the last 5 minutes, more than 5% of the requests handled by
            {{ $labels.job }} failed with a 5xx. Check its logs in Loki and its
            dependency circuit breakers.

  - name: zynema-latency
    rules:
      - alert: ZynemaHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, job) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: '{{ $labels.job }}'
        annotations:
          summary: '{{ $labels.job }} p99 latency is above 2s'
          description: >
            The 99th percentile of {{ $labels.job }}'s HTTP latency has been
            above 2 seconds for 10 minutes. Follow the slowest span in Tempo
            (the service dashboard links logs and traces).
