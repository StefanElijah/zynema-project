apiVersion: 1

providers:
  - name: Zynema
    orgId: 1
    folder: Zynema
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    # The JSON in git is the source of truth; edits go through a commit.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
