global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Eureka does not register itself: its metrics cannot come from the registry
  # it serves, so this one stays static.
  - job_name: 'eureka-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['eureka-server:8761']

  # Every application that registers in Eureka is discovered from the registry:
  # `make refresh-targets` regenerates targets/zynema.json and Prometheus
  # hot-reloads it (file_sd). The `job` label comes from the file, which is
  # what dashboards and alert rules group by. The committed snapshot keeps a
  # fresh checkout working without running the generator (ADR-0031).
  - job_name: 'zynema-services'
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
