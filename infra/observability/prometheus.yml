global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The bootstrap layer does not register with Eureka (the config server
  # registered in earlier phases, but its client is disabled to keep the
  # chicken-and-egg honest), so these two come from static targets.
  - job_name: 'eureka-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['eureka-server:8761']

  - job_name: 'config-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['config-server:8888']

  # Every application that registers in Eureka is discovered from the registry:
  # `make refresh-targets` regenerates targets/zynema.json and Prometheus
  # hot-reloads it (file_sd). The `job` label comes from the file, which is
  # what dashboards and alert rules group by. The committed snapshot keeps a
  # fresh checkout working without running the generator (ADR-0031).
  - job_name: 'zynema-services'
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        # Re-read the file on a timer instead of relying on inotify: with a
        # bind-mounted file on Docker Desktop the watch event does not always
        # reach the container, and targets silently go stale after a rebuild.
        refresh_interval: 30s
