name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'libs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.prettierignore'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'libs/**'

env:
  # Orval 8 (and its Scalar dependency) requires Node >= 22.
  NODE_VERSION: '22'

jobs:
  install:
    name: Install & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            libs/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

  lint:
    name: Lint, format, type-check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: ESLint (frontend) and contracts type-check
        run: pnpm lint
      - name: Type-check (frontend)
        run: pnpm --filter zynema-frontend typecheck
      - name: Prettier (whole repo, .prettierignore applies)
        run: pnpm format:check

  test:
    name: Unit tests (Vitest + coverage)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter zynema-frontend test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  build:
    name: Build (Vite, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      # Current LTS and the next one: a dependency dropping Node 22 should
      # fail one leg of the matrix, not surprise a contributor later.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter zynema-frontend build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-node${{ matrix.node }}
          path: frontend/dist/

  e2e:
    name: E2E (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [lint, build]
    strategy:
      fail-fast: false
      # One job per browser: each installs a single engine (cheaper than one
      # job installing both) and runs the suite in parallel.
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter zynema-frontend build
      # Install every engine: since Playwright 1.49 chromium needs its headless
      # shell too, and `install chromium` alone does not always provide it.
      - run: pnpm --filter zynema-frontend exec playwright install --with-deps
      # `exec playwright test` instead of the pnpm script: the extra `--` hop
      # dropped the --project filter and both browsers ran in both jobs.
      - run: pnpm --filter zynema-frontend exec playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
