name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'infra/config-repo/**'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Three groups instead of one long job: the wall clock drops without
      # changing what runs — each group builds its own dependencies with `-am`.
      matrix:
        group:
          - platform
          - domains
          - async
        include:
          - group: platform
            modules: event-contracts,common,eureka-server,config-server,api-gateway,auth-service
          - group: domains
            modules: catalog-service,user-service
          - group: async
            modules: payment-service,playback-service,bff-service,notification-service,video-worker

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zynema
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zynema"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # One lifecycle: tests are hermetic (no config server, no Eureka) and
      # integration tests bring their own containers.
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp -pl ${{ matrix.modules }} -am verify

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ matrix.group }}
          path: backend/**/target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.group }}
          path: backend/**/target/surefire-reports/

  quality:
    name: Quality (compose, layout, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Validate docker-compose
        run: docker compose config -q
      - name: Validate Maven multi-module layout
        working-directory: backend
        run: |
          mvn -B -ntp validate
      - name: Lint workflows
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          -w /repo
          rhysd/actionlint:latest
