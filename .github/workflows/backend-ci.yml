name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'infra/config-repo/**'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zynema
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zynema"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Verify Maven
        run: mvn -B -version

      # One lifecycle: tests are hermetic (no config server, no Eureka) and
      # integration tests bring their own containers, so a single verify is
      # enough — the previous three lifecycle passes tripled the job time.
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/**/target/site/jacoco/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/target/surefire-reports/

  quality:
    name: Quality (compose, layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config -q
      - name: Validate Maven multi-module layout
        working-directory: backend
        run: |
          mvn -B -ntp validate
