# Docker Compose â€” zynema-project
# Local production-grade simulation.
# All services use profiles to manage RAM usage on 8-16GB dev machines.
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
name: zynema

x-rest-java: &rest-java
  restart: unless-stopped
  networks: [zynema-net]
  env_file: .env
  environment: &rest-java-env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URL}
    # The import URL in each service's application.yml is built from these two
    # placeholders (`optional:configserver:http://${CONFIG_SERVER_HOST}...`),
    # and an explicit import URL wins over SPRING_CLOUD_CONFIG_URI. Without
    # them the containers asked for config at localhost:8888, the optional
    # import failed silently and the shared config was never applied.
    CONFIG_SERVER_HOST: ${CONFIG_SERVER_HOST:-config-server}
    CONFIG_SERVER_PORT: ${CONFIG_SERVER_PORT:-8888}
    SPRING_CLOUD_CONFIG_FAIL_FAST: 'false'
    SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
    # Split-horizon issuer (ADR-0015): validate the public issuer, fetch keys
    # from the internal Keycloak service name.
    ZYNEMA_SECURITY_ISSUER_URI: ${ZYNEMA_SECURITY_ISSUER_URI}
    ZYNEMA_SECURITY_JWK_SET_URI: ${ZYNEMA_SECURITY_JWK_SET_URI}
    ZYNEMA_SECURITY_AUDIENCE: ${ZYNEMA_SECURITY_AUDIENCE}
    # Inside the network Tempo is a service, not localhost. The signal path is
    # part of the value (see config-repo/application.yml).
    MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    MANAGEMENT_OTLP_TRACING_PROTOCOL: http/protobuf
    # Kafka and the Schema Registry are service names inside the network;
    # host-run services use the localhost defaults from the config repo.
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
    # Which coordination style drives the onboarding: choreographed or
    # orchestrated (ADR-0029). Flipping it switches both services at once.
    ZYNEMA_SAGA_MODE: ${ZYNEMA_SAGA_MODE:-choreographed}
  depends_on:
    eureka-server:
      condition: service_healthy
    config-server:
      condition: service_healthy

x-rest-java-no-config: &rest-java-no-config
  restart: unless-stopped
  networks: [zynema-net]
  env_file: .env
  # A DIFFERENT anchor name on purpose: reusing &rest-java-env here silently
  # replaced the extended env block above for every `<<: *rest-java-env`
  # service (last anchor definition wins), which quietly dropped the OTLP
  # endpoint, the saga mode and the security overrides.
  environment: &rest-java-no-config-env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URL}
    SPRING_CLOUD_CONFIG_FAIL_FAST: 'false'
    SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
  depends_on:
    eureka-server:
      condition: service_healthy

x-eureka: &eureka
  restart: unless-stopped
  networks: [zynema-net]
  env_file: .env
  environment:
    SPRING_PROFILES_ACTIVE: docker
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://localhost:8761/actuator/health']
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  # CORE INFRASTRUCTURE

  eureka-server:
    <<: *eureka
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/eureka-server/Dockerfile
    container_name: zynema-eureka
    ports:
      - '8761:8761'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8761/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  config-server:
    <<: *rest-java-no-config
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/config-server/Dockerfile
    container_name: zynema-config
    ports:
      - '8888:8888'
    environment:
      SPRING_PROFILES_ACTIVE: docker,native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_SERVER_GIT_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT-LABEL: ${CONFIG_SERVER_GIT_DEFAULT_LABEL}
    volumes:
      - ./infra/config-repo:/config-repo
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8888/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/api-gateway/Dockerfile
    container_name: zynema-gateway
    ports:
      - '8080:8080'
    environment:
      <<: *rest-java-env
      SERVER_PORT: 8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: 'true'
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_LOWER-CASE_SERVICE_ID: 'true'

  # DATA LAYER

  postgres:
    profiles: ['core']
    image: postgres:16-alpine
    container_name: zynema-postgres
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: '${POSTGRES_DB_CATALOG},${POSTGRES_DB_USER},${POSTGRES_DB_PAYMENT},${POSTGRES_DB_PLAYBACK},${POSTGRES_DB_AUTH},${POSTGRES_DB_NOTIFICATION}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/scripts/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    profiles: ['core']
    image: redis:7-alpine
    container_name: zynema-redis
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    profiles: ['core']
    image: confluentinc/cp-kafka:7.6.1
    container_name: zynema-kafka
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '9092:9092'
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # KRaft needs a base64url-encoded UUID (16 bytes, 22 chars), not a name:
      # the broker refuses to format its log directory otherwise, and the
      # alphabet must be URL-safe (no + or /).
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-PJ7D79_Yk_phHpfLZIC6cw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka:9092']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  schema-registry:
    profiles: ['core']
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: zynema-schema-registry
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      # Host port 8088: 8085 is playback-service, and 8080-8087 belong to
      # the services (see the comment in the keycloak block).
      - '${SCHEMA_REGISTRY_PORT:-8088}:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      # Compatibility is checked when a producer registers a new schema;
      # BACKWARD is the default and the one the contracts are written for.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy

  # Creates the platform's topics before any service starts. Auto-creation
  # stays enabled for the registry's internal topics, but these six are a
  # contract (event-contracts/KafkaTopics.java) and should be visible in the
  # broker even with no producer running yet.
  kafka-init:
    profiles: ['core']
    image: confluentinc/cp-kafka:7.6.1
    container_name: zynema-kafka-init
    networks: [zynema-net]
    restart: 'no'
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for topic in zynema.payment.events zynema.user.events zynema.playback.events \
                     zynema.notification.events zynema.user.commands zynema.notification.commands; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done
        echo "Topics ready:"
        kafka-topics --bootstrap-server kafka:9092 --list | grep zynema

  # DOMAIN MICROSERVICES

  catalog-service:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/catalog-service/Dockerfile
    container_name: zynema-catalog
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_CATALOG}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  user-service:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    container_name: zynema-user
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_USER}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # The Admin API inside the network: the realm lives in the keycloak service.
      ZYNEMA_IDENTITY_ADMIN_URL: http://keycloak:8080

  payment-service:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/payment-service/Dockerfile
    container_name: zynema-payment
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_PAYMENT}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  playback-service:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/playback-service/Dockerfile
    container_name: zynema-playback
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_PLAYBACK}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # The browser reaches the signed segments through the nginx edge, which
      # presents the host the signature was computed for (ADR-0024).
      HLS_PUBLIC_BASE_URL: http://localhost:${NGINX_HLS_PORT:-8090}/minio
      HLS_SEGMENT_URL_TTL: ${HLS_SEGMENT_URL_TTL:-60s}

  auth-service:
    <<: *rest-java
    profiles: ['auth']
    build:
      context: .
      dockerfile: ./backend/auth-service/Dockerfile
    container_name: zynema-auth
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_AUTH}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Token validation settings come from the shared anchor
      # (ZYNEMA_SECURITY_ISSUER_URI / JWK_SET_URI).
    depends_on:
      keycloak:
        condition: service_started

  frontend:
    profiles: ['core']
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: zynema-frontend
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '5173:80'
    depends_on:
      - api-gateway

  bff-service:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/bff-service/Dockerfile
    container_name: zynema-bff
    environment:
      <<: *rest-java-env
      # Token validation is wired by the shared anchor. For downstream calls the
      # BFF relays the caller's own token instead of minting a service one, so
      # no OAuth2 client registration is needed here.

  notification-service:
    <<: *rest-java
    profiles: ['core']
    build:
      context: .
      dockerfile: ./backend/notification-service/Dockerfile
    container_name: zynema-notification
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NOTIFICATION}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025

  # AUTH

  keycloak:
    profiles: ['auth']
    image: quay.io/keycloak/keycloak:25.0
    container_name: zynema-keycloak
    command: ['start-dev', '--import-realm', '--http-port=8080']
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '8180:8080'
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      # Public issuer: tokens always carry this URL, whether the request came
      # from the browser (localhost:8180) or from a service on the internal
      # network (keycloak:8080). Resource servers validate the issuer but fetch
      # JWKS from the internal URL — see ADR-0015.
      # Host port 8180 on purpose: 8080-8087 are taken by the services.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
    volumes:
      - ./infra/keycloak/realm-export:/opt/keycloak/data/import
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mailhog:
    # core too: the choreographed saga's notification step sends through it,
    # and notification-service belongs to the core profile.
    profiles: ['core', 'auth']
    image: mailhog/mailhog:latest
    container_name: zynema-mailhog
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '1025:1025'
      - '8025:8025'

  # STORAGE / VIDEO

  minio:
    profiles: ['storage']
    # MinIO stopped publishing community images to Docker Hub and quay, and the
    # official AIStor image refuses to serve without a licence. Chainguard
    # builds the community server from source; pinned by digest.
    image: cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9
    container_name: zynema-minio
    command: ['server', '/data', '--console-address', ':9001']
    restart: unless-stopped
    networks: [zynema-net]
    # The image's nonroot user cannot write the named volume; a local storage
    # container running as root is the honest trade (no shell utilities are
    # shipped for a chown dance, and there is no healthy-check tool either).
    user: '0:0'
    ports:
      - '127.0.0.1:9000:9000' # only nginx (and local tools) reach the API
      - '9001:9001' # console stays reachable for humans
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # No healthcheck: the image has no curl/wget. The worker's bucket
    # initialiser retries until the server answers instead.

  # Replaces the old mc-based bucket init: bucket creation is another job for
  # the worker's AWS SDK client, and no extra image is needed.
  # Run it with: make storage-init
  video-worker:
    profiles: ['storage']
    build:
      context: .
      dockerfile: ./backend/video-worker/Dockerfile
    image: zynema/video-worker:local
    container_name: zynema-video-worker
    restart: 'no'
    networks: [zynema-net]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS}
      MINIO_BUCKET_HLS: ${MINIO_BUCKET_HLS}
      CATALOG_URL: http://catalog-service:8083
      MEDIA_TOKEN_URL: http://keycloak:8080/realms/zynema/protocol/openid-connect/token
      MEDIA_CLIENT_ID: ${KEYCLOAK_CLIENT_ID_MEDIA:-zynema-media}
      MEDIA_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_MEDIA:-zynema-media-dev-secret}
    depends_on:
      minio:
        condition: service_started

  nginx-hls:
    profiles: ['storage']
    image: nginx:1.27-alpine
    container_name: zynema-nginx-hls
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '${NGINX_HLS_PORT:-8090}:80'
    volumes:
      - ./infra/nginx/hls.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_started

  # OBSERVABILITY (PLG + Tempo)

  prometheus:
    profiles: ['observability']
    image: prom/prometheus:latest
    container_name: zynema-prometheus
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      # Tempo's metrics generator remote-writes span metrics here (Fase 9).
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      # file_sd targets: regenerated from Eureka by `make refresh-targets`.
      - ./infra/observability/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    profiles: ['observability']
    image: grafana/grafana:latest
    container_name: zynema-grafana
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    profiles: ['observability']
    image: grafana/loki:2.9.8
    container_name: zynema-loki
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '${LOKI_PORT:-3100}:3100'
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    profiles: ['observability']
    image: grafana/promtail:2.9.8
    container_name: zynema-promtail
    restart: unless-stopped
    networks: [zynema-net]
    volumes:
      - ./infra/observability/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tempo:
    profiles: ['observability']
    image: grafana/tempo:2.5.0
    container_name: zynema-tempo
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '${TEMPO_PORT:-4318}:4318'
      - '4317:4317'
      # Query API: lets you inspect traces from the host
      # (curl localhost:3200/api/search?tags=service.name=catalog-service)
      - '${TEMPO_API_PORT:-3200}:3200'
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/observability/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  alertmanager:
    profiles: ['observability']
    image: prom/alertmanager:latest
    container_name: zynema-alertmanager
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - '${ALERTMANAGER_PORT:-9093}:9093'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9093/-/healthy']
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  zynema-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alertmanager-data:
