# ──────────────────────────────────────────────────────────────
# Docker Compose — zynema-project
# Local production-grade simulation.
# All services use profiles to manage RAM usage on 8-16GB dev machines.
# ──────────────────────────────────────────────────────────────
name: zynema

x-rest-java: &rest-java
  restart: unless-stopped
  networks: [zynema-net]
  env_file: .env
  environment: &rest-java-env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URL}
    SPRING_CLOUD_CONFIG_FAIL_FAST: "false"
    SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
  depends_on:
    eureka-server:
      condition: service_healthy
    config-server:
      condition: service_healthy

x-rest-java-no-config: &rest-java-no-config
  restart: unless-stopped
  networks: [zynema-net]
  env_file: .env
  environment: &rest-java-env
    SPRING_PROFILES_ACTIVE: docker
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
    SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URL}
    SPRING_CLOUD_CONFIG_FAIL_FAST: "false"
    SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL: 3000
  depends_on:
    eureka-server:
      condition: service_healthy

x-eureka: &eureka
  restart: unless-stopped
  networks: [zynema-net]
  env_file: .env
  environment:
    SPRING_PROFILES_ACTIVE: docker
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  # ════════════════════ CORE INFRASTRUCTURE ════════════════════

  eureka-server:
    <<: *eureka
    profiles: ["core"]
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    container_name: zynema-eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  config-server:
    <<: *rest-java-no-config
    profiles: ["core"]
    build:
      context: ./backend/config-server
      dockerfile: Dockerfile
    container_name: zynema-config
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_SERVER_GIT_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT-LABEL: ${CONFIG_SERVER_GIT_DEFAULT_LABEL}
    volumes:
      - ./infra/config-repo:/config-repo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-gateway:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: zynema-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *rest-java-env
      SERVER_PORT: 8080
      SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: "true"
      SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER-CASE_SERVICE_ID: "true"

  # ════════════════════ DATA LAYER ════════════════════

  postgres:
    profiles: ["core"]
    image: postgres:16-alpine
    container_name: zynema-postgres
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "${POSTGRES_DB_CATALOG},${POSTGRES_DB_USER},${POSTGRES_DB_PAYMENT},${POSTGRES_DB_PLAYBACK},${POSTGRES_DB_AUTH},${POSTGRES_DB_NOTIFICATION}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/scripts/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    profiles: ["core"]
    image: redis:7-alpine
    container_name: zynema-redis
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    profiles: ["core"]
    image: confluentinc/cp-kafka:7.6.1
    container_name: zynema-kafka
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: zynema-cluster
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  schema-registry:
    profiles: ["core"]
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: zynema-schema-registry
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ════════════════════ DOMAIN MICROSERVICES ════════════════════

  catalog-service:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    container_name: zynema-catalog
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_CATALOG}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  user-service:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: zynema-user
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_USER}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  payment-service:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    container_name: zynema-payment
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_PAYMENT}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  playback-service:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/playback-service
      dockerfile: Dockerfile
    container_name: zynema-playback
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_PLAYBACK}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

  auth-service:
    <<: *rest-java
    profiles: ["auth"]
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: zynema-auth
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_AUTH}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_URL}
    depends_on:
      keycloak:
        condition: service_started

  frontend:
    profiles: ["core"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zynema-frontend
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

  bff-service:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/bff-service
      dockerfile: Dockerfile
    container_name: zynema-bff
    environment:
      <<: *rest-java-env
      SERVER_PORT: 8090
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}

  notification-service:
    <<: *rest-java
    profiles: ["core"]
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: zynema-notification
    environment:
      <<: *rest-java-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NOTIFICATION}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025

  # ════════════════════ AUTH ════════════════════

  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:25.0
    container_name: zynema-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-export:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mailhog:
    profiles: ["auth"]
    image: mailhog/mailhog:latest
    container_name: zynema-mailhog
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "1025:1025"
      - "8025:8025"

  # ════════════════════ STORAGE / VIDEO ════════════════════

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    container_name: zynema-minio
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: ["storage"]
    image: minio/mc:latest
    container_name: zynema-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks: [zynema-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET_VIDEOS} || true &&
      mc mb -p local/${MINIO_BUCKET_HLS} || true &&
      mc anonymous set download local/${MINIO_BUCKET_HLS} || true &&
      echo 'MinIO buckets initialized'
      "

  nginx-hls:
    profiles: ["storage"]
    image: nginx:1.27-alpine
    container_name: zynema-nginx-hls
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "${NGINX_HLS_PORT:-8090}:80"
    volumes:
      - ./infra/nginx/hls.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      minio:
        condition: service_healthy

  # ════════════════════ OBSERVABILITY (PLG + Tempo) ════════════════════

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: zynema-prometheus
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: zynema-grafana
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    profiles: ["observability"]
    image: grafana/loki:2.9.8
    container_name: zynema-loki
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:2.9.8
    container_name: zynema-promtail
    restart: unless-stopped
    networks: [zynema-net]
    volumes:
      - ./infra/observability/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.5.0
    container_name: zynema-tempo
    restart: unless-stopped
    networks: [zynema-net]
    ports:
      - "${TEMPO_PORT:-4318}:4318"
      - "4317:4317"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

networks:
  zynema-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
