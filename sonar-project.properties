# SonarCloud configuration for the whole monorepo.
#
# One project, three source roots: Java services, the SPA and the generated
# contracts package. Reports come from the test runs of the analysis workflow:
# JaCoCo XML per module and the frontend's lcov.
sonar.projectKey=StefanElijah_zynema-project
sonar.organization=stefanelijah_zynema-project
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src,libs/api-contracts/src
sonar.tests=backend,frontend/src,libs/api-contracts/src
sonar.test.inclusions=backend/**/src/test/java/**,frontend/src/**/*.{test,spec}.{ts,tsx}

# Generated code is not ours to grade; build output is not source.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/coverage/**,libs/api-contracts/src/generated/**,frontend/src/vite-env.d.ts

sonar.java.binaries=backend/*/target/classes
sonar.java.test.binaries=backend/*/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/*/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
