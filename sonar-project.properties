# SonarCloud configuration for the whole monorepo.
#
# One project, three source roots: Java services, the SPA and the generated
# contracts package. Reports come from the test runs of the analysis workflow:
# JaCoCo XML per module and the frontend's lcov.
sonar.projectKey=StefanElijah_zynema-project
sonar.organization=stefanelijah-zynema-project
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src,libs/api-contracts/src
sonar.tests=backend,frontend/src,libs/api-contracts/src
# Sonar patterns do not support brace expansion: `*.{test,spec}.{ts,tsx}`
# silently matched nothing, the test files were classified as main code and
# their uncovered lines sank the new-coverage condition. One pattern per
# extension.
sonar.test.inclusions=backend/**/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

# Generated code is not ours to grade; build output is not source.
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/coverage/**,libs/api-contracts/src/generated/**,frontend/src/vite-env.d.ts

sonar.java.binaries=backend/*/target/classes
sonar.java.test.binaries=backend/*/target/test-classes

# Explicit per-module paths: the wildcard form did not resolve (the importer
# warned "No coverage report can be found") and the backend ended up with no
# coverage imported at all — the 11% overall was the frontend lcov only.
sonar.coverage.jacoco.xmlReportPaths=\
  backend/event-contracts/target/site/jacoco/jacoco.xml,\
  backend/common/target/site/jacoco/jacoco.xml,\
  backend/eureka-server/target/site/jacoco/jacoco.xml,\
  backend/config-server/target/site/jacoco/jacoco.xml,\
  backend/api-gateway/target/site/jacoco/jacoco.xml,\
  backend/auth-service/target/site/jacoco/jacoco.xml,\
  backend/user-service/target/site/jacoco/jacoco.xml,\
  backend/catalog-service/target/site/jacoco/jacoco.xml,\
  backend/payment-service/target/site/jacoco/jacoco.xml,\
  backend/playback-service/target/site/jacoco/jacoco.xml,\
  backend/bff-service/target/site/jacoco/jacoco.xml,\
  backend/notification-service/target/site/jacoco/jacoco.xml,\
  backend/video-worker/target/site/jacoco/jacoco.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Wiring and generated-style code stay analyzed for issues but out of the
# coverage metric: the bootstrap entry, the route table, the shadcn
# primitives, the static footer and the oidc-client-ts plumbing have no
# logic worth asserting. The mirror of this list lives in vite.config.js so
# the local number and the dashboard agree.
sonar.coverage.exclusions=frontend/src/main.tsx,frontend/src/App.tsx,frontend/src/components/ui/**,frontend/src/components/organisms/Footer.tsx,frontend/src/lib/auth/userManager.ts

# The video worker calls ffmpeg from PATH on purpose: the image installs it
# and fixes PATH, and the command is built from validated arguments, not user
# input. Sonar's S4036 flags any PATH resolution, so the rule is excluded for
# this module with the justification on record instead of silenced globally.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/video-worker/**
