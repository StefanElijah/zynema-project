spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/zynema_payment
    username: ${POSTGRES_USER:zynema}
    password: ${POSTGRES_PASSWORD:devpassword}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: 'zynema:payment:'
  cloud:
    openfeign:
      circuitbreaker:
        # Left off on purpose: the integration names its instance after the
        # generated client type and method, which makes the tuning below
        # unreachable. The circuit breaker is declared with @CircuitBreaker on
        # the calling service so its name stays stable ("user-service").
        enabled: false
      client:
        config:
          default:
            connectTimeout: 1000
            # Also the time bound of the call: a blocking HTTP call does not
            # need Resilience4j's TimeLimiter on top.
            readTimeout: 3000
  # Security settings (issuer, JWKS, audience) are shared by every service
  # and live in the config repository: see zynema.security.* in
  # infra/config-repo/application.yml. Authorization rules live in SecurityConfig.
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

# Per-dependency resilience policies. Composition, from outside in:
#   @Retry( @CircuitBreaker( @Bulkhead( HTTP call ) ) )
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 80
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 200ms
        # Only transient transport failures are retried. Retrying 4xx would
        # repeat a rejected request, and retrying 5xx can amplify an outage.
        retryExceptions:
          - feign.RetryableException
        ignoreExceptions:
          - dev.zynema.common.exception.DownstreamServiceException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  bulkhead:
    instances:
      user-service:
        maxConcurrentCalls: 20
        maxWaitDuration: 50ms

server:
  port: 8084
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: payment-service
    description: Subscriptions, payments, billing with idempotency keys
