spring:
  application:
    name: bff-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # NOTE: OAuth2 client registration against Keycloak is added in Fase 3.
  # Declaring an issuer-uri here triggers OIDC discovery at startup, which
  # would make the BFF un-bootable in the `core` profile (Keycloak lives in
  # the `auth` profile). Kept out until Fase 3 wires the token relay.
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

server:
  port: 8086
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: bff-service
    description: "Backend-for-Frontend: WebClient aggregator for the frontend"
