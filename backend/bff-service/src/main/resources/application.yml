spring:
  application:
    name: bff-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # The BFF does not register an OAuth2 client: for user-initiated calls it
  # relays the caller's token (see WebClientConfig) and the shared JWT decoder
  # validates it on the way in. Declaring an issuer-uri here would trigger OIDC
  # discovery at startup and make the BFF un-bootable without Keycloak.
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

server:
  port: 8086
  shutdown: graceful

zynema:
  bff:
    clients:
      # lb:// resolves through Eureka; tests replace these with fixed URLs so
      # WireMock can stand in for the dependency.
      catalog: ${BFF_CATALOG_URL:lb://catalog-service}
      user: ${BFF_USER_URL:lb://user-service}
      payment: ${BFF_PAYMENT_URL:lb://payment-service}
      playback: ${BFF_PLAYBACK_URL:lb://playback-service}
    http:
      # One slow dependency must not hold the screen: the BFF composes several
      # calls per request, and the client is the only place with a hard bound.
      connect-timeout: 1s
      response-timeout: 3s
    cache:
      key-prefix: 'zynema:bff:'
      # TTLs instead of eviction: writes happen in the domain services, which
      # do not know who caches their data. Anonymous pages can be staler than
      # personalized ones.
      home-ttl: 5m
      content-ttl: 2m
      account-ttl: 60s
      profile-home-ttl: 60s

resilience4j:
  circuitbreaker:
    instances:
      catalog-service: &downstream-circuit-breaker
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
      user-service: *downstream-circuit-breaker
      payment-service: *downstream-circuit-breaker
      playback-service: *downstream-circuit-breaker
  retry:
    # What is worth retrying (transport errors, 5xx) and what is not (4xx) is
    # decided in ResilienceConfig: class lists in YAML cannot express
    # "any 4xx" over WebClientResponseException.
    instances:
      catalog-service: &downstream-retry
        maxAttempts: 3
        waitDuration: 200ms
      user-service: *downstream-retry
      payment-service: *downstream-retry
      playback-service: *downstream-retry
  bulkhead:
    instances:
      catalog-service: &downstream-bulkhead
        # Per dependency: twelve parallel card lookups from one screen must
        # not starve the rest of the traffic.
        maxConcurrentCalls: 20
      user-service: *downstream-bulkhead
      payment-service: *downstream-bulkhead
      playback-service: *downstream-bulkhead

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: bff-service
    description: 'Backend-for-Frontend: WebClient aggregator for the frontend'
