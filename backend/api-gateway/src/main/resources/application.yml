server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  profiles:
    active: default
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            # NOTE: X-Correlation-Id is echoed by both the gateway and the
            # downstream service, so responses carry it twice with the same
            # value. DedupeResponseHeader cannot collapse it here because the
            # downstream headers are merged after the filter's post-phase runs.
            # Harmless: repeated headers with an identical value are valid HTTP
            # and every reader takes the first one.
            - PreserveHostHeader
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

# Per-route rate limits (token bucket in Redis). Routes omitted here are not
# limited. A limit that is too tight is worse than no limit: these are sized for
# a local demo without getting in the way of normal browsing.
zynema:
  rate-limit:
    routes:
      catalog:
        # Anonymous traffic keyed by client address: protects the public reads.
        replenish-rate: 20
        burst-capacity: 40
      catalog-admin:
        replenish-rate: 5
        burst-capacity: 10
      user:
        replenish-rate: 30
        burst-capacity: 60
      playback:
        replenish-rate: 30
        burst-capacity: 60
      payment:
        replenish-rate: 10
        burst-capacity: 20
      auth-public:
        replenish-rate: 5
        burst-capacity: 10

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

info:
  app:
    name: api-gateway
    description: Zynema reactive API gateway
