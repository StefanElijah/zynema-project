spring:
  application:
    name: playback-service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.lob.non_contextual_creation: true
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/zynema_playback
    username: ${POSTGRES_USER:zynema}
    password: ${POSTGRES_PASSWORD:devpassword}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      cache-null-values: false
      key-prefix: 'zynema:playback:'
  cloud:
    openfeign:
      circuitbreaker:
        # Off on purpose: the integration names its instance after the
        # generated client type and method, detaching the tuning below. The
        # circuit breakers are declared with @CircuitBreaker (see
        # PlaybackDependencies) so their names stay stable.
        enabled: false
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000
  # Security settings (issuer, JWKS, audience) are shared by every service
  # and live in the config repository: see zynema.security.* in
  # infra/config-repo/application.yml. Authorization rules live in SecurityConfig.
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

zynema:
  playback:
    storage:
      # What this service uses to read manifests.
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      # The host a signature must be valid for: the one nginx presents to
      # MinIO. Same address inside the compose network; set it explicitly when
      # the service runs outside it (signture host mismatch = 403).
      presign-endpoint: ${HLS_PRESIGN_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:zynema-admin}
      secret-key: ${MINIO_SECRET_KEY:change-me-in-real-life}
      hls-bucket: ${MINIO_BUCKET_HLS:zynema-hls}
      # Where a browser can reach the same object: the nginx edge that fronts
      # MinIO's API (location /minio/).
      public-base-url: ${HLS_PUBLIC_BASE_URL:http://localhost:8090/minio}
      path-style: true
      # Short on purpose: a segment URL is used right after its playlist is
      # fetched, and an expired signature is the point of signing at all.
      segment-ttl: ${HLS_SEGMENT_URL_TTL:60s}

# Per-dependency resilience. Composition: @Retry( @CircuitBreaker( @Bulkhead( call ) ) ).
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
      catalog-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
      payment-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - feign.RetryableException
        ignoreExceptions:
          - dev.zynema.common.exception.DownstreamServiceException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      catalog-service:
        maxAttempts: 3
        waitDuration: 200ms
        retryExceptions:
          - feign.RetryableException
        ignoreExceptions:
          - dev.zynema.common.exception.DownstreamServiceException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
      payment-service:
        # Entitlements already degrade to the free tier, so a retry is cheap
        # insurance against a single blip.
        maxAttempts: 2
        waitDuration: 100ms
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  bulkhead:
    instances:
      user-service:
        maxConcurrentCalls: 20
        maxWaitDuration: 50ms
      catalog-service:
        maxConcurrentCalls: 20
        maxWaitDuration: 50ms
      payment-service:
        maxConcurrentCalls: 10
        maxWaitDuration: 50ms

server:
  port: 8085
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: playback-service
    description: Playback sessions, signed URLs, event sourcing for watch history
